name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build
        env:
          # Vite checks env vars at build time. The keys can be empty in CI;
          # they're only required at runtime. If you have a CI-only project
          # for Supabase, populate these via repo secrets instead.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'http://localhost:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}

  integration:
    name: RLS trust-model integration
    # Required gate (no conditional skip): the RLS denial suite is the strongest
    # safety net, so it must actually run. rls.test.ts fails loudly if the env
    # below is missing rather than skipping to a false green (review T-07).
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Provision .env for the integration runner
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}"
            echo "E2E_STAFF_PASSWORD=${{ secrets.E2E_STAFF_PASSWORD }}"
            # The signup-gate test creates real accounts through handle_new_user
            # and can only delete them again with the service role (there is no
            # profiles DELETE policy by design). It fails loudly without this.
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          } > .env
      - run: npm run test:integration

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Required gate (no conditional skip), matching the integration job above.
    # This job used to carry `if: ${{ vars.E2E_PREVIEW_URL != '' }}`, so losing
    # or renaming that repo variable skipped the entire Playwright suite and the
    # PR went green with zero e2e coverage — the exact false-green failure mode
    # the integration job was hardened against. The check below fails loudly
    # instead. E2E_PREVIEW_URL is a repo *variable* (the `secrets` context isn't
    # allowed in a job-level `if`); the seeded passwords are secrets.
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Require the e2e environment
        env:
          E2E_BASE_URL: ${{ vars.E2E_PREVIEW_URL }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
        run: |
          missing=""
          for v in E2E_BASE_URL SUPABASE_URL SUPABASE_ANON_KEY E2E_PASSWORD E2E_STAFF_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required e2e configuration:$missing"
            echo "E2E_BASE_URL comes from the E2E_PREVIEW_URL repo variable; the rest are repo secrets."
            exit 1
          fi
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_PREVIEW_URL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          # The specs' REST arrange/cleanup helpers need these; without them
          # helpers.ts now throws rather than silently no-opping.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
