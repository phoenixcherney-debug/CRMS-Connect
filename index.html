<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#257200" />
    <meta name="description" content="CRMS Connect — Colorado Rocky Mountain School's private platform connecting students with alumni and parent opportunities." />
    <!-- PWA / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CRMS Connect" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CRMS Connect</title>
  </head>
  <body>
    <script>
      // Task 20 — mirror ThemeContext at first paint so a system-light
      // user doesn't get a dark flash before React mounts.
      (function(){
        var stored = localStorage.getItem('crms-theme') || localStorage.getItem('theme');
        var theme = stored;
        if (theme !== 'dark' && theme !== 'light') {
          theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.setAttribute('data-theme','dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
